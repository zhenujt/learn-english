name: Deploy GitHub Pages

# One repository has a single Pages site, so both apps ship in one artifact:
# sentence-trainer at /<repo>/anki/, docs at /<repo>/docs-simple-grammar/,
# vocabulary at /<repo>/words/, and the preposition lesson at /<repo>/preposition/.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - ".github/pages/**"
      - "zero-to-work-english/04-工作沟通B1/sentence-trainer/**"
      - "docs-site/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  TRAINER_DIR: zero-to-work-english/04-工作沟通B1/sentence-trainer

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python phonetics dependency
        run: python -m pip install --disable-pip-version-check eng-to-ipa==0.0.2

      - name: Install sentence trainer dependencies
        working-directory: ${{ env.TRAINER_DIR }}
        run: npm ci

      - name: Build sentence trainer
        working-directory: ${{ env.TRAINER_DIR }}
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/anki/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Install docs editor dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build docs editor
        working-directory: docs-site
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/docs-simple-grammar/
          VITE_SITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}
          VITE_GITHUB_BRANCH: ${{ github.ref_name }}
          VITE_GITHUB_API_BASE: ${{ vars.DOCS_GITHUB_API_BASE }}
          VITE_GITHUB_API_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Combine both sites
        run: |
          mkdir -p _site
          cp -r .github/pages/. _site/
          mkdir -p _site/anki
          cp -r "$TRAINER_DIR/dist/." _site/anki/
          mkdir -p _site/docs-simple-grammar
          cp -r docs-site/dist/. _site/docs-simple-grammar/
          mkdir -p _site/words
          cp docs-site/dist/index.html _site/words/index.html
          mkdir -p _site/preposition
          cp docs-site/dist/index.html _site/preposition/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
